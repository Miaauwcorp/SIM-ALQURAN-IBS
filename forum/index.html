<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forum SIM Murojaah</title>
<meta name="description" content="Panduan penggunaan SIM Murojaah dan ruang diskusi muhafizh MAS Al-Ihsan Boarding School Riau.">
<meta property="og:type" content="website">
<meta property="og:title" content="Forum SIM Murojaah">
<meta property="og:description" content="Panduan penggunaan SIM Murojaah dan ruang diskusi muhafizh MAS Al-Ihsan Boarding School Riau.">
<meta name="theme-color" content="#0b3d2c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b8892e' d='M12 2L14.93 4.93L19.07 4.93L19.07 9.07L22 12L19.07 14.93L19.07 19.07L14.93 19.07L12 22L9.07 19.07L4.93 19.07L4.93 14.93L2 12L4.93 9.07L4.93 4.93L9.07 4.93Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --hutan: var(--brand-hutan, #0b3d2c);
  --daun: var(--brand-daun, #15803d);
  --on-daun: #ffffff;
  --daun-teks: #11652f;
  --kertas: #f1f4f2;
  --permukaan: #ffffff;
  --tinta: #17241d;
  --redup: #56675d;
  --garis: #d8e1db;
  --garis-kuat: #b7c6bc;
  --emas: #a67818;
  --emas-lembut: #f6ecd6;
  --merah: #b42318;
  --radius: 10px;
  --radius-s: 6px;
  --font: "Plus Jakarta Sans", "Noto Naskh Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-ar: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --hutan: #0a2a1f;
    --daun: #45b26d;
    --on-daun: #04190c;
    --daun-teks: #74d196;
    --kertas: #0f1915;
    --permukaan: #16231d;
    --tinta: #e4ede7;
    --redup: #9aada1;
    --garis: #243830;
    --garis-kuat: #36524a;
    --emas: #dcae52;
    --emas-lembut: #3a2f17;
    --merah: #f2887c;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--kertas);
  color: var(--tinta);
  font: 400 1rem/1.6 var(--font);
}
a { color: var(--daun-teks); }
code { font-size: .9em; background: var(--garis); padding: .1em .35em; border-radius: 4px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
:focus-visible { outline: 2px solid var(--daun); outline-offset: 2px; }

.wrap {
  width: 100%;
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(1.25rem, env(safe-area-inset-left));
  padding-right: max(1.25rem, env(safe-area-inset-right));
}

/* ---------- Kepala halaman ---------- */
.masthead { background: var(--hutan); color: #f1f6f2; padding-top: env(safe-area-inset-top); }
.masthead-in {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  min-height: 4.5rem; padding-top: .75rem; padding-bottom: .75rem;
}
.brand { display: flex; align-items: center; gap: .8rem; color: inherit; text-decoration: none; min-width: 0; }
.brand-mark {
  width: 2.6rem; height: 2.6rem; flex: none; display: grid; place-items: center;
  border-radius: 50%; background: rgba(255, 255, 255, .09); overflow: hidden;
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; }
.brand-mark svg { width: 1.55rem; height: 1.55rem; fill: #e0b75e; }
.brand-text { min-width: 0; }
.brand-name { display: block; font-weight: 800; font-size: 1.22rem; line-height: 1.2; letter-spacing: -.012em; }
.brand-sub {
  display: block; font-size: .8rem; opacity: .72;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.who { display: flex; align-items: center; gap: .75rem; flex: none; font-size: .875rem; }
.who[hidden] { display: none; }
.who-name { font-weight: 600; max-width: 11rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-btn {
  color: #f1f6f2; background: none; font: 600 .85rem var(--font);
  border: 1px solid rgba(255, 255, 255, .3); border-radius: 999px;
  padding: .38rem .85rem; cursor: pointer; text-decoration: none;
}
.who-btn:hover { background: rgba(255, 255, 255, .08); }
.who-btn:focus-visible { outline-color: #e0b75e; }

main { flex: 1; padding-top: 1.5rem; padding-bottom: 3rem; outline: none; }

/* ---------- Tombol & isian ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  height: 2.75rem; padding: 0 1.1rem; border-radius: var(--radius);
  border: 1px solid transparent; font: 600 .95rem/1 var(--font);
  cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--daun); color: var(--on-daun); }
.btn-primary:hover { filter: brightness(1.07); }
.btn-quiet { background: transparent; border-color: var(--garis-kuat); color: var(--tinta); }
.btn-quiet:hover { background: var(--permukaan); }
.btn-small { height: 2.15rem; padding: 0 .8rem; font-size: .85rem; border-radius: var(--radius-s); }
.btn-danger { color: var(--merah); border-color: var(--garis-kuat); background: transparent; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .6; cursor: progress; }
.link-btn {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: 600 .8rem var(--font); color: var(--redup);
  text-decoration: underline; text-underline-offset: 2px;
}
.link-btn.danger { color: var(--merah); }

input[type="text"], input[type="password"], input[type="search"], select, textarea {
  width: 100%; font: inherit; color: var(--tinta); background: var(--permukaan);
  border: 1px solid var(--garis-kuat); border-radius: var(--radius-s); padding: .7rem .8rem;
}
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--daun); outline-offset: 0; border-color: var(--daun);
}
textarea { resize: vertical; min-height: 7rem; line-height: 1.65; }
.field { margin-bottom: 1.1rem; }
.field label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .35rem; }
.hint { font-size: .8rem; color: var(--redup); margin: .4rem 0 0; }
.counter { font-variant-numeric: tabular-nums; }
.counter.near { color: var(--emas); }
.form-error { color: var(--merah); font-size: .875rem; font-weight: 600; margin: .25rem 0 .9rem; }
.form-error[hidden] { display: none; }
.form-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.note {
  background: var(--emas-lembut); color: var(--tinta); border-radius: var(--radius-s);
  padding: .7rem .9rem; font-size: .9rem; margin: 1rem 0 0;
}

/* ---------- Daftar topik ---------- */
.toolbar { display: flex; gap: .75rem; align-items: center; }
.search { flex: 1; position: relative; }
.search input { height: 2.75rem; padding: 0 .9rem 0 2.5rem; border-radius: var(--radius); }
.search svg {
  position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
  width: 1.05rem; height: 1.05rem; stroke: var(--redup); fill: none; stroke-width: 2; pointer-events: none;
}
.cats {
  display: flex; gap: 1.35rem; overflow-x: auto; margin-top: 1.1rem;
  border-bottom: 1px solid var(--garis); scrollbar-width: none;
}
.cats::-webkit-scrollbar { display: none; }
.cat-btn {
  flex: none; background: none; border: 0; border-bottom: 2px solid transparent;
  margin-bottom: -1px; padding: .65rem 0; cursor: pointer;
  font: 500 .925rem var(--font); color: var(--redup);
}
.cat-btn:hover { color: var(--tinta); }
.cat-btn[aria-pressed="true"] { color: var(--tinta); font-weight: 700; border-bottom-color: var(--daun); }

.list-info { font-size: .85rem; color: var(--redup); margin: 1rem 0 0; }
.topics { list-style: none; margin: 0; padding: 0; }
.topic { border-bottom: 1px solid var(--garis); }
.topic-link {
  display: grid; grid-template-columns: 1fr auto; gap: 1rem;
  padding: 1.1rem .15rem; color: inherit; text-decoration: none;
}
.topic-link:hover .topic-title { color: var(--daun-teks); }
.topic-title { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.38; overflow-wrap: anywhere; }
.topic-excerpt {
  margin: .3rem 0 0; color: var(--redup); font-size: .925rem; line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.meta { margin: .55rem 0 0; display: flex; flex-wrap: wrap; gap: .2rem .8rem; font-size: .8125rem; color: var(--redup); }
.meta .author { color: var(--tinta); font-weight: 600; }
.meta .kat { color: var(--daun-teks); font-weight: 600; }
.meta .kat.gold, .thread-cat.gold { color: var(--emas); }
.count { text-align: right; min-width: 3.6rem; padding-top: .1rem; }
.count strong { display: block; font-size: 1.3rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.count span { font-size: .75rem; color: var(--redup); }
.count .fresh { display: block; margin-top: .3rem; font-weight: 700; color: var(--daun-teks); }
.star { width: .9em; height: .9em; fill: var(--emas); vertical-align: -.08em; margin-right: .35rem; }
.lock { width: .85em; height: .85em; stroke: var(--redup); fill: none; stroke-width: 2.2; vertical-align: -.06em; margin-left: .35rem; }
.more { padding: 1.5rem 0 0; }

.skel { padding: 1.15rem .15rem; border-bottom: 1px solid var(--garis); }
.skel i { display: block; height: .75rem; border-radius: 4px; background: var(--garis); margin: .5rem 0; }
.skel i:nth-child(1) { width: 62%; height: 1rem; }
.skel i:nth-child(2) { width: 88%; }
.skel i:nth-child(3) { width: 34%; }

.state { padding: 2.5rem 0 1rem; }
.state h2 { font-size: 1.12rem; margin: 0 0 .35rem; line-height: 1.35; }
.state p { color: var(--redup); margin: 0 0 1.1rem; max-width: 34rem; }

/* ---------- Isi topik ---------- */
.back {
  display: inline-flex; align-items: center; gap: .45rem; padding: .25rem 0;
  color: var(--redup); text-decoration: none; font-size: .9rem; font-weight: 600;
}
.back::before {
  content: ""; width: .45rem; height: .45rem; margin-left: .15rem;
  border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg);
}
.back:hover { color: var(--tinta); }
.thread-head { margin-top: 1rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--garis); }
.thread-cat { margin: 0 0 .4rem; font-size: .85rem; font-weight: 600; color: var(--daun-teks); }
.thread-title {
  margin: 0; font-size: clamp(1.45rem, 4.6vw, 2.05rem); line-height: 1.2;
  font-weight: 800; letter-spacing: -.016em; overflow-wrap: anywhere;
}
.thread-title:focus { outline: none; }
.byline { display: flex; align-items: center; gap: .75rem; margin-top: 1.1rem; font-size: .875rem; }
.byline strong { display: block; font-size: .95rem; }
.byline .sub { color: var(--redup); }

.avatar {
  width: 2.4rem; height: 2.4rem; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: .82rem; letter-spacing: .02em;
  background: var(--av-bg); color: var(--av-fg);
}
.av0 { --av-bg: #dcefe3; --av-fg: #145c33; }
.av1 { --av-bg: #f3e4c4; --av-fg: #7a5510; }
.av2 { --av-bg: #d6eaec; --av-fg: #1d5b63; }
.av3 { --av-bg: #e5e2f0; --av-fg: #4a3f7a; }
.av4 { --av-bg: #efdfd9; --av-fg: #80392c; }
.av5 { --av-bg: #e2e8e4; --av-fg: #3c4a42; }
@media (prefers-color-scheme: dark) {
  .av0 { --av-bg: #1d3d2a; --av-fg: #9fdcb5; }
  .av1 { --av-bg: #3c3016; --av-fg: #e8c77e; }
  .av2 { --av-bg: #183a3e; --av-fg: #9bd3da; }
  .av3 { --av-bg: #2c2842; --av-fg: #c5bdf0; }
  .av4 { --av-bg: #3f231d; --av-fg: #f0b3a5; }
  .av5 { --av-bg: #26302b; --av-fg: #c2cec7; }
}

.post-body, .reply-body { overflow-wrap: anywhere; }
.post-body { font-size: 1.03rem; line-height: 1.75; padding: 1.3rem 0; }
.post-body p, .reply-body p { margin: 0 0 .9em; }
.post-body p:last-child, .reply-body p:last-child { margin-bottom: 0; }
.post-body .ar, .reply-body .ar {
  font-family: var(--font-ar); font-size: 1.45em; line-height: 2.15; text-align: right;
}

.thread-actions {
  display: flex; flex-wrap: wrap; gap: .5rem;
  padding-bottom: 1.4rem; border-bottom: 1px solid var(--garis);
}
.replies-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 1.75rem 0 .25rem; }
.replies-head h2 { font-size: 1rem; font-weight: 700; margin: 0; }
.reply-list { list-style: none; margin: 0; padding: 0; }
.reply {
  display: grid; grid-template-columns: 2.4rem 1fr; gap: .85rem;
  padding: 1rem .35rem; margin: 0 -.35rem; border-bottom: 1px solid var(--garis); border-radius: var(--radius-s);
}
.reply-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .6rem; font-size: .82rem; color: var(--redup); }
.reply-head strong { font-size: .93rem; color: var(--tinta); }
.reply-body { margin-top: .3rem; line-height: 1.7; }
.reply-tools { margin-top: .45rem; }
.no-replies { color: var(--redup); font-size: .925rem; padding: .75rem 0 0; margin: 0; }

.composer { margin-top: 1.75rem; }
.composer > label { display: block; font-weight: 700; font-size: .95rem; margin-bottom: .55rem; }
.composer .form-foot, .reply-edit .form-foot { margin-top: .7rem; }
.reply-edit { margin-top: .5rem; }

@media (prefers-reduced-motion: no-preference) {
  .skel i { animation: denyut 1.3s ease-in-out infinite alternate; }
  .reply.is-new { animation: tandai 2.6s ease-out; }
}
@keyframes denyut { to { opacity: .45; } }
@keyframes tandai { from { background: var(--emas-lembut); } to { background: transparent; } }

/* ---------- Masuk ---------- */
.login { max-width: 24rem; margin: 2.25rem auto 0; }
.login h1 { font-size: 1.65rem; font-weight: 800; letter-spacing: -.012em; margin: 0 0 .35rem; }
.login h1:focus { outline: none; }
.login .lead { color: var(--redup); margin: 0 0 1.5rem; }
.login .btn { width: 100%; margin-top: .25rem; }
.pw { position: relative; }
.pw input { padding-right: 4.5rem; }
.pw .link-btn { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); }

/* ---------- Tulis topik ---------- */
.compose h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.012em; margin: 1rem 0 1.4rem; }
.compose h1:focus { outline: none; }

/* ---------- Kaki & toast ---------- */
.foot {
  border-top: 1px solid var(--garis); font-size: .85rem; color: var(--redup);
  padding-top: 1.3rem; padding-bottom: calc(1.3rem + env(safe-area-inset-bottom));
}
.foot a { font-weight: 600; }
#toast {
  position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom));
  transform: translate(-50%, .75rem); width: max-content; max-width: calc(100vw - 2rem);
  background: var(--tinta); color: var(--kertas); border-radius: 14px;
  padding: .7rem 1.15rem; font-size: .9rem; font-weight: 600; line-height: 1.4; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: var(--merah); color: #fff; }

@media (max-width: 560px) {
  .who-name { display: none; }
  .brand-name { font-size: 1.1rem; }
  .brand-sub { max-width: 13rem; }
  .topic-link { gap: .75rem; }
  .count { min-width: 3rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Editor (Tulis / Pratinjau, gambar, langkah) ---------- */
.editor {
  border: 1px solid var(--garis-kuat); border-radius: var(--radius);
  background: var(--permukaan); overflow: hidden;
}
.editor:focus-within { border-color: var(--daun); box-shadow: 0 0 0 1px var(--daun); }
.editor.dragging { border-color: var(--emas); box-shadow: 0 0 0 2px var(--emas); }
.editor-bar {
  display: flex; align-items: center; justify-content: space-between; gap: .25rem .5rem; flex-wrap: wrap;
  padding: .3rem .4rem; border-bottom: 1px solid var(--garis);
}
.editor-tabs { display: flex; gap: .15rem; }
.editor-tabs button {
  background: none; border: 0; border-radius: var(--radius-s); cursor: pointer;
  padding: .42rem .65rem; font: 600 .84rem var(--font); color: var(--redup);
}
.editor-tabs button[aria-selected="true"] { color: var(--tinta); background: var(--kertas); }
.editor-tools { display: flex; gap: .1rem; }
.tool {
  display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
  background: none; border: 0; border-radius: var(--radius-s);
  padding: .42rem .55rem; font: 600 .82rem var(--font); color: var(--tinta);
}
.tool:hover { background: var(--kertas); }
.tool svg { width: 1.05rem; height: 1.05rem; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tool[disabled] { opacity: .35; cursor: default; background: none; }
.tool b { font-size: .95rem; padding: 0 .2rem; }
.editor textarea { display: block; border: 0; border-radius: 0; min-height: 8rem; }
.editor textarea:focus-visible { outline: none; }
.editor-preview { padding: .9rem 1rem; min-height: 8rem; font-size: .98rem; line-height: 1.7; overflow-wrap: anywhere; }
.editor-preview[hidden] { display: none; }
.editor-preview p { margin: 0 0 .9em; }
.compose .editor textarea { min-height: 16rem; }
.compose .editor-preview { min-height: 16rem; }
.btn-row { display: flex; gap: .5rem; margin-left: auto; }

/* ---------- Isi: langkah, tebal, gambar ---------- */
.post-body ol, .post-body ul, .reply-body ol, .reply-body ul, .editor-preview ol, .editor-preview ul {
  margin: 0 0 .9em; padding-left: 1.65rem;
}
.post-body li, .reply-body li, .editor-preview li { margin: .3rem 0; padding-left: .25rem; }
.post-body ol > li::marker, .reply-body ol > li::marker, .editor-preview ol > li::marker {
  font-weight: 800; color: var(--daun-teks);
}
.post-body strong, .reply-body strong, .editor-preview strong { font-weight: 700; }
.shot { margin: .4rem 0 1.25rem; }
.shot-zoom {
  display: block; max-width: 100%; min-width: 8rem; min-height: 4rem; padding: 0; overflow: hidden;
  border: 1px solid var(--garis); border-radius: var(--radius-s); background: var(--permukaan); cursor: zoom-in;
}
.shot img { display: block; max-width: 100%; width: auto; height: auto; max-height: min(34rem, 75vh); }
.shot figcaption { margin-top: .45rem; font-size: .85rem; color: var(--redup); line-height: 1.5; }
ol + .shot, ul + .shot, .shot + .shot { margin-left: 1.9rem; }
.shot-pending, .shot-missing {
  display: block; border: 1px dashed var(--garis-kuat); border-radius: var(--radius-s);
  padding: 1rem 1.1rem; font-size: .85rem; color: var(--redup); margin: .4rem 0 1.25rem;
}
.edited { color: var(--redup); }

/* ---------- Bagikan ---------- */
.share { position: relative; }
.share-btn svg { width: 1rem; height: 1rem; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.share-menu {
  position: absolute; top: calc(100% + .35rem); left: 0; z-index: 5; min-width: 13rem;
  background: var(--permukaan); border: 1px solid var(--garis-kuat); border-radius: var(--radius);
  padding: .35rem; box-shadow: 0 10px 28px rgba(8, 30, 18, .16);
}
.share-menu[hidden] { display: none; }
.share-menu > * {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-radius: var(--radius-s);
  padding: .62rem .75rem; font: 500 .92rem var(--font); color: var(--tinta); text-decoration: none;
}
.share-menu > *:hover, .share-menu > *:focus-visible { background: var(--kertas); outline: none; }

/* ---------- Penampil gambar ---------- */
.lightbox {
  width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; margin: 0;
  border: 0; padding: 0; background: transparent; color: #eef3ef;
}
.lightbox::backdrop { background: rgba(6, 14, 10, .9); }
.lightbox[open] {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8rem;
  padding: calc(4rem + env(safe-area-inset-top)) 1rem calc(1.25rem + env(safe-area-inset-bottom));
}
.lb-bar {
  position: fixed; top: calc(.9rem + env(safe-area-inset-top)); right: 1rem; left: 1rem;
  display: flex; justify-content: flex-end; gap: .6rem;
}
.lb-btn {
  color: #fff; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .28);
  border-radius: 999px; padding: .45rem .95rem; font: 600 .85rem var(--font); text-decoration: none; cursor: pointer;
}
.lb-btn:hover { background: rgba(255, 255, 255, .2); }
.lightbox img { max-width: 100%; max-height: calc(100% - 3rem); object-fit: contain; border-radius: 4px; background: #fff; }
.lightbox p { margin: 0; max-width: 42rem; text-align: center; font-size: .92rem; line-height: 1.5; }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-in">
    <a class="brand" href="#/">
      <span class="brand-mark" id="brandMark"></span>
      <span class="brand-text">
        <span class="brand-name">Forum Murojaah</span>
        <span class="brand-sub" id="brandSub">MAS Al-Ihsan Boarding School Riau</span>
      </span>
    </a>
    <div class="who" id="who" hidden></div>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1">
  <noscript><p>Forum ini butuh JavaScript. Aktifkan JavaScript di browser, lalu muat ulang halaman.</p></noscript>
</main>

<footer class="wrap foot">
  <a href="../">Buka aplikasi SIM Murojaah</a>
</footer>

<dialog id="lightbox" class="lightbox" aria-label="Gambar diperbesar">
  <div class="lb-bar">
    <a class="lb-btn" id="lbOpen" href="#" target="_blank" rel="noopener">Buka ukuran asli</a>
    <button class="lb-btn" type="button" id="lbClose">Tutup</button>
  </div>
  <img id="lbImg" alt="">
  <p id="lbCap" dir="auto"></p>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* =======================================================
     PENGATURAN
     Ganti WEB_APP_URL dengan URL Web App Apps Script Anda:
     Apps Script > Deploy > Manage deployments > Web app URL
     (berakhiran /exec).
     ======================================================= */
  var CONFIG = {
    WEB_APP_URL: "https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT/exec",
    PAGE_SIZE: 20,
    STALE_MS: 60 * 1000,
    IMAGE_MAX_SIDE: 1600
  };

  var KEY = {
    session: "simForum.session",
    meta: "simForum.meta",
    seen: "simForum.seen",
    client: "simForum.clientId",
    firstVisit: "simForum.firstVisit",
    lastUser: "simForum.lastUser",
    draftTopic: "simForum.draft.topik",
    draftReply: "simForum.draft.balasan."
  };

  var DEFAULT_META = {
    appName: "SIM MUROJAAH AL-QURAN",
    institutionName: "MAS Al-Ihsan Boarding School Riau",
    logoUrl: "",
    primaryColor: "",
    sidebarColor: "",
    publicRead: true,
    categories: [
      { id: "panduan", label: "Panduan SIM", adminOnly: true },
      { id: "umum", label: "Umum" },
      { id: "tahfizh", label: "Tahfizh & Murojaah" },
      { id: "hadits", label: "Hadits Arbain" },
      { id: "aplikasi", label: "Kendala Aplikasi" },
      { id: "pengumuman", label: "Pengumuman", adminOnly: true }
    ],
    limits: { judulMin: 5, judul: 150, isi: 10000, balasan: 4000, gambarBytes: 2097152 }
  };

  var STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L14.93 4.93L19.07 4.93L19.07 9.07L22 12L19.07 14.93L19.07 19.07L14.93 19.07L12 22L9.07 19.07L4.93 19.07L4.93 14.93L2 12L4.93 9.07L4.93 4.93L9.07 4.93Z"/></svg>';
  var LOCK = '<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  var SEARCH = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  var ICON_IMG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>';
  var ICON_STEP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 5h1v4M4 9h2"/><path d="M4 15.5a1.2 1.2 0 0 1 2 .9c0 .8-2 1.6-2 2.6h2.2"/></svg>';
  var ICON_SHARE = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>';

  /* ---------- Penyimpanan lokal ---------- */
  var store = {
    get: function (k, fallback) {
      try {
        var v = localStorage.getItem(k);
        return v ? JSON.parse(v) : (fallback === undefined ? null : fallback);
      } catch (e) { return fallback === undefined ? null : fallback; }
    },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  var state = {
    session: store.get(KEY.session),
    meta: Object.assign({}, DEFAULT_META, store.get(KEY.meta) || {}),
    seen: store.get(KEY.seen, {}) || {},
    firstVisit: store.get(KEY.firstVisit) || Date.now(),
    list: { kategori: "", q: "", page: 1, topics: [], hasMore: false, total: 0, key: "", loadedAt: 0, scrollY: 0 },
    topic: null,
    topicLoadedAt: 0,
    prefetched: null,
    returnTo: "",
    view: ""
  };
  store.set(KEY.firstVisit, state.firstVisit);

  if (state.session && (!state.session.token || Number(state.session.expiresAt) < Date.now())) {
    state.session = null;
    store.del(KEY.session);
  }

  var app = document.getElementById("app");
  var navSeq = 0;
  var listSeq = 0;
  var lastHash = "";

  /* ---------- Utilitas ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function noop() {}

  function esc(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function isConfigured() {
    return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(CONFIG.WEB_APP_URL) &&
      CONFIG.WEB_APP_URL.indexOf("GANTI_") === -1;
  }

  function clientId() {
    var id = store.get(KEY.client);
    if (!id) {
      var bytes = new Uint8Array(10);
      (window.crypto || window.msCrypto).getRandomValues(bytes);
      id = "FRM" + Array.prototype.map.call(bytes, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
      store.set(KEY.client, id);
    }
    return id;
  }

  function deviceInfo() {
    return "Forum web | " + String(navigator.userAgent || "").slice(0, 180) + " [CLIENT_ID:" + clientId() + "]";
  }

  function limits() { return Object.assign({}, DEFAULT_META.limits, state.meta.limits || {}); }
  function isAdmin() { return !!(state.session && state.session.user && state.session.user.isAdmin); }

  function catById(id) {
    var list = state.meta.categories || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function catLabel(id) { var c = catById(id); return c ? c.label : (id || "Umum"); }
  function catGold(id) { var c = catById(id); return !!(c && c.adminOnly); }

  function setTitle(text) {
    document.title = text ? text + " – Forum Murojaah" : "Forum SIM Murojaah";
  }

  var rtf = window.Intl && Intl.RelativeTimeFormat ? new Intl.RelativeTimeFormat("id", { numeric: "auto" }) : null;
  function timeAgo(iso) {
    var t = Date.parse(iso);
    if (!t) return "";
    var s = Math.round((t - Date.now()) / 1000);
    var abs = Math.abs(s);
    if (abs < 45) return "baru saja";
    if (rtf && abs < 3600) return rtf.format(Math.round(s / 60), "minute");
    if (rtf && abs < 86400) return rtf.format(Math.round(s / 3600), "hour");
    if (rtf && abs < 7 * 86400) return rtf.format(Math.round(s / 86400), "day");
    var d = new Date(t);
    var opts = { day: "numeric", month: "short" };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
    return new Intl.DateTimeFormat("id-ID", opts).format(d);
  }
  function fullDate(iso) {
    var t = Date.parse(iso);
    if (!t) return "";
    return new Intl.DateTimeFormat("id-ID", { dateStyle: "full", timeStyle: "short" }).format(new Date(t));
  }
  function timeTag(iso) {
    return '<time datetime="' + esc(iso) + '" title="' + esc(fullDate(iso)) + '">' + esc(timeAgo(iso)) + "</time>";
  }
  function editedTag(iso) {
    return iso ? '<span class="edited" title="Diedit ' + esc(fullDate(iso)) + '">diedit</span>' : "";
  }

  function initials(nama) {
    var clean = String(nama || "").replace(/^(ust\.?|ustadz|ustaz|ustadzah|ustazah|h\.|hj\.)\s+/i, "");
    var words = clean.split(/\s+/).filter(Boolean);
    if (!words.length) return "?";
    return ((words[0][0] || "") + (words[1] ? words[1][0] : "")).toUpperCase();
  }
  function avatar(author) {
    var key = String(author.username || author.nama || "");
    var h = 0;
    for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return '<span class="avatar av' + (h % 6) + '" aria-hidden="true">' + esc(initials(author.nama)) + "</span>";
  }

  /* =======================================================
     PERENDER ISI
     - baris "1. ..." menjadi langkah bernomor, "- ..." menjadi butir
     - **teks** menjadi tebal, tautan http(s) otomatis aktif
     - ![keterangan](gambar:ID) menjadi gambar dari Google Drive
     - paragraf yang mayoritas huruf Arab tampil RTL
     ======================================================= */
  var IMG_TOKEN = /!\[([^\]\n]*)\]\((gambar|unggah):([A-Za-z0-9_-]{1,80})\)/g;
  var AR_CHARS = /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g;

  function driveThumb(id, w) {
    return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w" + w;
  }

  function arabicHeavy(text) {
    var letters = text.replace(/[\s0-9.,;:!?()\[\]"'«»\-–—*_\/]/g, "");
    if (!letters) return false;
    return (text.match(AR_CHARS) || []).length / letters.length > 0.5;
  }

  function bold(escaped) {
    return escaped.replace(/\*\*(?=\S)([^\n]*?\S)\*\*/g, "<strong>$1</strong>");
  }

  function inline(raw) {
    var parts = String(raw).split(/(https?:\/\/[^\s<>"']+)/g);
    return parts.map(function (part, i) {
      if (i % 2 === 0) return bold(esc(part));
      var url = part, tail = "";
      var m = url.match(/[.,;:!?)\]]+$/);
      if (m) { tail = m[0]; url = url.slice(0, -tail.length); }
      var label = url.replace(/^https?:\/\/(www\.)?/, "");
      if (label.length > 48) label = label.slice(0, 45) + "…";
      return '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer nofollow">' + esc(label) + "</a>" + esc(tail);
    }).join("").replace(/\n/g, "<br>");
  }

  function formatText(text) {
    var blocks = [];
    var cur = null;
    function flush() { if (cur) { blocks.push(cur); cur = null; } }

    String(text).split("\n").forEach(function (line) {
      var t = line.trim();
      if (!t) { flush(); return; }
      var num = t.match(/^(\d{1,3})[.)]\s+(.*)$/);
      var dot = t.match(/^[-•*]\s+(.*)$/);
      if (num) {
        if (!cur || cur.type !== "ol") { flush(); cur = { type: "ol", start: parseInt(num[1], 10), items: [] }; }
        cur.items.push(num[2]);
      } else if (dot) {
        if (!cur || cur.type !== "ul") { flush(); cur = { type: "ul", items: [] }; }
        cur.items.push(dot[1]);
      } else if (cur && cur.type !== "p") {
        cur.items[cur.items.length - 1] += "\n" + t;   // lanjutan dari langkah sebelumnya
      } else {
        if (!cur) cur = { type: "p", lines: [] };
        cur.lines.push(line);
      }
    });
    flush();

    return blocks.map(function (b) {
      if (b.type === "p") {
        var raw = b.lines.join("\n");
        return arabicHeavy(raw)
          ? '<p class="ar" dir="rtl" lang="ar">' + inline(raw) + "</p>"
          : '<p dir="auto">' + inline(raw) + "</p>";
      }
      var start = b.type === "ol" && b.start !== 1 ? ' start="' + b.start + '"' : "";
      return "<" + b.type + start + ">" + b.items.map(function (it) {
        return '<li dir="auto">' + inline(it) + "</li>";
      }).join("") + "</" + b.type + ">";
    }).join("");
  }

  function figureHTML(alt, kind, id) {
    if (kind === "unggah") return '<div class="shot-pending">Mengunggah gambar…</div>';
    if (id.length < 10) return "";
    return '<figure class="shot">' +
      '<button type="button" class="shot-zoom" data-zoom="' + esc(id) + '" data-alt="' + esc(alt) + '" ' +
      'aria-label="Perbesar gambar' + (alt ? ": " + esc(alt) : "") + '">' +
      '<img src="' + esc(driveThumb(id, 1200)) + '" alt="' + esc(alt) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
      "</button>" +
      (alt ? '<figcaption dir="auto">' + inline(alt) + "</figcaption>" : "") +
      "</figure>";
  }

  function formatBody(text) {
    text = String(text || "");
    var html = "", last = 0, m;
    var re = new RegExp(IMG_TOKEN.source, "g");
    while ((m = re.exec(text))) {
      html += formatText(text.slice(last, m.index));
      html += figureHTML(m[1].trim(), m[2], m[3]);
      last = re.lastIndex;
    }
    return html + formatText(text.slice(last));
  }

  /* ---------- Umpan balik ---------- */
  var toastTimer = null;
  function toast(msg, isError) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.className = isError ? "show err" : "show";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = isError ? "err" : ""; }, isError ? 4500 : 2600);
  }

  function setBusy(btn, busy, label) {
    if (!btn) return;
    if (busy) {
      btn.dataset.label = btn.innerHTML;
      btn.textContent = label || "Memproses…";
      btn.disabled = true;
    } else {
      if (btn.dataset.label) btn.innerHTML = btn.dataset.label;
      btn.disabled = false;
    }
  }

  function showFormError(form, msg) {
    var el = $(".form-error", form);
    if (!el) return;
    el.textContent = msg || "";
    el.hidden = !msg;
  }

  function markSeen(id, count) {
    state.seen[id] = count;
    var keys = Object.keys(state.seen);
    if (keys.length > 400) keys.slice(0, keys.length - 400).forEach(function (k) { delete state.seen[k]; });
    store.set(KEY.seen, state.seen);
  }

  function bindCounter(field, max) {
    var out = $('.counter[data-for="' + field.id + '"]');
    if (!out) return;
    function update() {
      var n = field.value.length;
      out.textContent = n > max * 0.8 ? n + " / " + max : "";
      out.className = "hint counter" + (n > max * 0.95 ? " near" : "");
    }
    field.addEventListener("input", update);
    update();
  }

  function submitOnCtrlEnter(field, form) {
    field.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (form.requestSubmit) form.requestSubmit();
        else form.dispatchEvent(new Event("submit", { cancelable: true }));
      }
    });
  }

  function focusHeading() {
    var h = $("h1", app);
    if (h) {
      if (!h.hasAttribute("tabindex")) h.setAttribute("tabindex", "-1");
      h.focus({ preventScroll: true });
    }
  }

  function setView(name) {
    if (state.view === "list" && name !== "list") state.list.scrollY = window.scrollY;
    state.view = name;
  }

  /* ---------- Komunikasi dengan Apps Script ---------- */
  function ApiError(message, info) {
    this.message = message;
    this.info = info || {};
  }
  ApiError.prototype = Object.create(Error.prototype);

  function api(action, data) {
    if (!isConfigured()) return Promise.reject(new ApiError("Forum belum tersambung ke server.", { setup: true }));

    var payload = Object.assign({ action: action }, data || {});
    if (state.session && state.session.token && payload.token === undefined) payload.token = state.session.token;

    /* Body string tanpa header khusus = request "simple", jadi tidak ada preflight CORS. */
    return fetch(CONFIG.WEB_APP_URL, {
      method: "POST",
      body: JSON.stringify(payload),
      redirect: "follow"
    }).catch(function () {
      throw new ApiError("Server forum tidak bisa dihubungi. Periksa koneksi internet, lalu coba lagi.", { network: true });
    }).then(function (res) {
      return res.json().catch(function () {
        throw new ApiError("Jawaban server tidak terbaca. Pastikan Web App sudah di-deploy ulang dengan akses \"Anyone\".");
      });
    }).then(function (json) {
      if (json.meta) applyMeta(json.meta, true);
      if (json.authError) {
        clearSession();
        throw new ApiError(json.message || "Masuk dulu untuk melanjutkan.", { auth: true });
      }
      if (json.sessionExpired && state.session) {
        clearSession();
        toast("Sesi forum berakhir. Masuk lagi untuk menulis atau membalas.", true);
        setTimeout(function () { state.view = ""; route(); }, 0);
      }
      if (!json.success) throw new ApiError(json.message || "Permintaan gagal.", json);
      if (json.user && state.session) {
        state.session.user = json.user;
        store.set(KEY.session, state.session);
        renderWho();
      }
      return json;
    });
  }

  function applyMeta(meta, fromServer) {
    state.meta = Object.assign({}, DEFAULT_META, state.meta, meta);
    if (fromServer) {
      state.meta._at = Date.now();
      store.set(KEY.meta, state.meta);
    }

    var root = document.documentElement.style;
    if (/^#[0-9a-f]{6}$/i.test(state.meta.primaryColor || "")) root.setProperty("--brand-daun", state.meta.primaryColor);
    if (/^#[0-9a-f]{6}$/i.test(state.meta.sidebarColor || "")) root.setProperty("--brand-hutan", state.meta.sidebarColor);

    $("#brandSub").textContent = state.meta.institutionName || DEFAULT_META.institutionName;

    var mark = $("#brandMark");
    if (!mark.firstChild) mark.innerHTML = STAR.replace('class="star"', "");
    var logo = state.meta.logoUrl;
    if (logo && /^https:\/\//.test(logo) && mark.dataset.src !== logo) {
      mark.dataset.src = logo;
      var img = new Image();
      img.alt = "";
      img.referrerPolicy = "no-referrer";
      img.onload = function () { mark.innerHTML = ""; mark.appendChild(img); };
      img.src = logo;
    }
  }

  function clearSession() {
    state.session = null;
    store.del(KEY.session);
    state.list.loadedAt = 0;
    renderWho();
  }

  function handleError(err, target, retry) {
    if (err.info && err.info.auth) {
      renderLogin(location.hash || "#/", err.message);
      return;
    }
    if (err.info && err.info.setup) { renderSetup(); return; }
    if (target) {
      target.innerHTML =
        '<div class="state"><h2>Gagal memuat</h2><p>' + esc(err.message) + '</p>' +
        '<button class="btn btn-quiet" type="button" data-act="retry">Coba lagi</button></div>';
      var btn = $('[data-act="retry"]', target);
      if (btn) btn.addEventListener("click", retry || route);
    } else {
      toast(err.message, true);
    }
  }

  /* ---------- Kepala: nama pengguna ---------- */
  function renderWho() {
    var who = $("#who");
    if (state.session && state.session.user) {
      var u = state.session.user;
      who.innerHTML =
        '<span class="who-name" title="' + esc(u.nama + " (" + u.roleLabel + ")") + '">' + esc(u.nama) + "</span>" +
        '<button class="who-btn" type="button" id="btnLogout">Keluar</button>';
      who.hidden = false;
      $("#btnLogout").addEventListener("click", function () {
        clearSession();
        toast("Anda sudah keluar. Forum tetap bisa dibaca.");
        state.view = "";
        route();
      });
    } else if (state.meta.publicRead !== false && state.view !== "login") {
      who.innerHTML = '<a class="who-btn" href="#/masuk">Masuk</a>';
      who.hidden = false;
    } else {
      who.hidden = true;
      who.innerHTML = "";
    }
  }

  /* ---------- Router ---------- */
  function go(hash) {
    if (location.hash === hash) route();
    else location.hash = hash;
  }

  function parseRoute() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    if (h.indexOf("t/") === 0) return { name: "topic", id: h.slice(2) };
    if (h.indexOf("edit/") === 0) return { name: "edit", id: h.slice(5) };
    if (h === "baru") return { name: "new" };
    if (h === "masuk") return { name: "login" };
    return { name: "list" };
  }

  function route() {
    var seq = ++navSeq;
    if (!isConfigured()) { renderSetup(); return; }

    var r = parseRoute();
    var loggedIn = !!(state.session && state.session.token);

    if (r.name === "login") {
      if (loggedIn) { go("#/"); return; }
      var back = lastHash && lastHash !== "#/masuk" ? lastHash : "#/";
      renderLogin(state.returnTo || back);
      return;
    }

    if (!loggedIn) {
      if (r.name === "new" || r.name === "edit") { renderLogin(location.hash); return; }
      if (state.meta.publicRead === false) {
        /* Admin mematikan baca publik: cek ulang sesekali, siapa tahu sudah dibuka lagi. */
        var fresh = state.meta._at && Date.now() - state.meta._at < 3600 * 1000;
        if (!fresh) {
          renderLoading();
          api("forum_meta").catch(noop).then(function () {
            state.meta._at = state.meta._at || Date.now();
            if (seq === navSeq) route();
          });
          return;
        }
        renderLogin(location.hash || "#/");
        return;
      }
    }

    if (r.name === "new") { renderTopicForm("new"); return; }
    if (r.name === "edit") { loadEdit(r.id, seq); return; }
    if (r.name === "topic") { loadTopic(r.id, seq); return; }
    loadList({ seq: seq });
  }

  /* ---------- Tampilan: umum ---------- */
  function renderSetup() {
    setView("setup");
    app.innerHTML =
      '<section class="state"><h1 class="thread-title">Forum belum tersambung ke server</h1>' +

  /* ---------- Tampilan: masuk ---------- */
  function renderLogin(returnTo, notice) {

    setView("login");
    setTitle("Masuk");
    renderWho();
    if (location.hash !== "#/masuk" && !notice) history.replaceState(null, "", "#/masuk");

    var form = $("#formLogin");

    var pass = $("#lPass");

    $("#togglePw").addEventListener("click", function () {

  /* ---------- Tampilan: daftar topik ---------- */
  function renderListShell() {
    if (state.view === "list" && $("#topics")) { syncCats(); return; }
    setView("list");
    setTitle("");
    renderWho();

    var L = state.list;
    var canWrite = !!state.session;

    app.innerHTML =
      '<h1 class="sr-only">Daftar topik forum</h1>' +
      '<div class="toolbar">' +
      '<label class="search"><span class="sr-only">Cari topik</span>' + SEARCH +
      '<input id="q" type="search" placeholder="Cari topik" value="' + esc(L.q) + '" enterkeyhint="search" autocomplete="off"></label>' +
      (canWrite

      }).join("") +
      "</nav>" +
      '<div id="topics" aria-live="polite"></div>';

    var q = $("#q");

      var val = q.value.trim();
      if (val === L.q) return;
      L.q = val;
      loadList({ force: true });
    }
    q.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(applySearch, 450); });
    q.addEventListener("keydown", function (e) { if (e.key === "Enter") { clearTimeout(timer); applySearch(); } });

    $(".cats").addEventListener("click", function (e) {
      var b = e.target.closest(".cat-btn");
      if (!b) return;
      L.kategori = b.dataset.cat;
      syncCats();

  function syncCats() {
    var buttons = document.querySelectorAll(".cat-btn");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute("aria-pressed", String(buttons[i].dataset.cat === state.list.kategori));
    }
  }

  function loadList(opts) {
    opts = opts || {};
    var L = state.list;
    var key = L.kategori + "|" + L.q;
    var fresh = !opts.force && L.key === key && L.loadedAt && Date.now() - L.loadedAt < CONFIG.STALE_MS;
    var restoreScroll = state.view !== "list";

    renderListShell();

    if (fresh) {
      renderTopics();
      if (restoreScroll) window.scrollTo(0, L.scrollY || 0);
      return;
    }

    var box = $("#topics");
    if (!opts.quiet) box.innerHTML = skeleton(5);

    var seq = ++listSeq;
    api("forum_list_topics", { kategori: L.kategori, q: L.q, page: 1, pageSize: CONFIG.PAGE_SIZE })
      .then(function (res) {
        if (seq !== listSeq || state.view !== "list") return;
        L.topics = res.topics || [];
        L.hasMore = !!res.hasMore;
        L.total = res.total || 0;
        L.page = 1;
        L.key = key;
        L.loadedAt = Date.now();
        renderTopics();
        if (restoreScroll) window.scrollTo(0, 0);
      })
      .catch(function (err) {
        if (seq !== listSeq) return;
        handleError(err, $("#topics"), function () { loadList({ force: true }); });
      });
  }

  function loadMore(btn) {
    var L = state.list;
    setBusy(btn, true, "Memuat…");
    var seq = listSeq;
    api("forum_list_topics", { kategori: L.kategori, q: L.q, page: L.page + 1, pageSize: CONFIG.PAGE_SIZE })
      .then(function (res) {
        if (seq !== listSeq) return;
        var have = {};
        L.topics.forEach(function (t) { have[t.id] = true; });
        (res.topics || []).forEach(function (t) { if (!have[t.id]) L.topics.push(t); });
        L.page = res.page;
        L.hasMore = !!res.hasMore;
        L.total = res.total || L.total;
        renderTopics();
      })
      .catch(function (err) {
        setBusy(btn, false);
        toast(err.message, true);
      });
  }

  function freshLabel(t) {
