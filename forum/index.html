  /* =======================================================
     EDITOR: Tulis / Pratinjau, sisip gambar, langkah, tebal
     ======================================================= */
  function editorHTML(o) {
    return '<div class="editor">' +
      '<div class="editor-bar">' +
      '<div class="editor-tabs" role="tablist" aria-label="Mode penulisan">' +
      '<button type="button" role="tab" aria-selected="true" data-tab="tulis">Tulis</button>' +
      '<button type="button" role="tab" aria-selected="false" data-tab="lihat">Pratinjau</button>' +
      "</div>" +
      '<div class="editor-tools">' +
      '<button type="button" class="tool" data-tool="gambar" title="Sisipkan gambar (bisa juga tempel atau seret)">' + ICON_IMG + "<span>Gambar</span></button>" +
      '<button type="button" class="tool" data-tool="langkah" title="Tambah langkah bernomor">' + ICON_STEP + "<span>Langkah</span></button>" +
      '<button type="button" class="tool" data-tool="tebal" title="Tebalkan teks (Ctrl+B)" aria-label="Tebal"><b>B</b></button>' +
      "</div></div>" +
      '<textarea id="' + o.id + '" maxlength="' + o.max + '" dir="auto"' +
      (o.placeholder ? ' placeholder="' + esc(o.placeholder) + '"' : "") + ">" + esc(o.value || "") + "</textarea>" +
      '<div class="editor-preview" hidden></div>' +
      '<input type="file" accept="image/*" multiple hidden>' +
      "</div>";
  }

  function setupEditor(root, o) {
    o = o || {};
    var ta = $("textarea", root);
    var preview = $(".editor-preview", root);
    var fileInput = $('input[type="file"]', root);
    var box = $(".editor", root);
    var pending = 0;
    var queue = Promise.resolve();
    var saveTimer = null;

    function changed() {
      ta.dispatchEvent(new Event("input", { bubbles: true }));
      if (!preview.hidden) renderPreview();
    }
    function renderPreview() {
      preview.innerHTML = ta.value.trim()
        ? formatBody(ta.value)
        : '<p class="hint">Belum ada isi untuk dipratinjau.</p>';
    }
    function setTab(name) {
      var showPreview = name === "lihat";
      Array.prototype.forEach.call(root.querySelectorAll("[data-tab]"), function (b) {
        b.setAttribute("aria-selected", String(b.dataset.tab === name));
      });
      Array.prototype.forEach.call(root.querySelectorAll(".tool"), function (b) { b.disabled = showPreview; });
      if (showPreview) {
        renderPreview();
        preview.style.minHeight = ta.offsetHeight + "px";
      }
      ta.hidden = showPreview;
      preview.hidden = !showPreview;
      if (!showPreview) ta.focus();
    }

    function insertBlock(text) {
      var v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
      var before = v.slice(0, s), after = v.slice(e);
      var pre = before && !/\n$/.test(before) ? "\n" : "";
      var post = after.charAt(0) === "\n" ? "" : "\n";
      ta.value = before + pre + text + post + after;
      var pos = before.length + pre.length + text.length + 1;
      ta.setSelectionRange(pos, pos);
    }
    function replaceToken(from, to) {
      var v = ta.value, i = v.indexOf(from);
      if (i === -1) return;
      var end = i + from.length;
      if (!to && v.charAt(end) === "\n") end++;
      var s = ta.selectionStart, delta = to.length - (end - i);
      ta.value = v.slice(0, i) + to + v.slice(end);
      if (s >= end) ta.setSelectionRange(s + delta, s + delta);
    }
    function addStep() {
      var v = ta.value, s = ta.selectionStart;
      var before = v.slice(0, s);
      var nums = before.match(/^\s*(\d{1,3})[.)]\s/gm);
      var n = nums ? parseInt(nums[nums.length - 1], 10) + 1 : 1;
      var lineStart = before.lastIndexOf("\n") + 1;
      var prefix = before.slice(lineStart).trim() ? "\n" + n + ". " : n + ". ";
      ta.setRangeText(prefix, s, ta.selectionEnd, "end");
      ta.focus();
      changed();
    }
    function makeBold() {
      var s = ta.selectionStart, e = ta.selectionEnd;
      var sel = ta.value.slice(s, e) || "teks tebal";
      ta.setRangeText("**" + sel + "**", s, e, "end");
      ta.setSelectionRange(s + 2, s + 2 + sel.length);
      ta.focus();
      changed();
    }

    function uploadFiles(list) {
      var files = Array.prototype.filter.call(list || [], function (f) { return /^image\//.test(f.type); });
      if (!files.length) { toast("Pilih file gambar (JPG, PNG, WEBP, atau GIF).", true); return; }
      if (!state.session) { toast("Masuk dulu untuk mengunggah gambar.", true); return; }
      if (!preview.hidden) setTab("tulis");

      files.forEach(function (file) {
        var label = String(file.name || "gambar").replace(/[\[\]()\n]/g, "").slice(0, 40);
        var token = "![Mengunggah " + label + "…](unggah:" + Math.random().toString(36).slice(2, 10) + ")";
        insertBlock(token);
        pending++;
        queue = queue.then(function () {
          return prepareImage(file)
            .then(function (img) { return api("forum_upload_image", img); })
            .then(function (res) {
              replaceToken(token, "![](gambar:" + res.id + ")");
              if (res.shared === false && res.message) toast(res.message, true);
            })
            .catch(function (err) {
              replaceToken(token, "");
              toast((err && err.message) || "Gambar gagal diunggah.", true);
            })
            .then(function () { pending--; changed(); });
        });
      });
      changed();
      toast(files.length > 1 ? "Mengunggah " + files.length + " gambar…" : "Mengunggah gambar…");
    }

    root.addEventListener("click", function (e) {
      var tab = e.target.closest("[data-tab]");
      if (tab && root.contains(tab)) { setTab(tab.dataset.tab); return; }
      var tool = e.target.closest("[data-tool]");
      if (!tool || tool.disabled) return;
      if (tool.dataset.tool === "gambar") fileInput.click();
      if (tool.dataset.tool === "langkah") addStep();
      if (tool.dataset.tool === "tebal") makeBold();
    });
    fileInput.addEventListener("change", function () {
      uploadFiles(fileInput.files);
      fileInput.value = "";
    });
    ta.addEventListener("paste", function (e) {
      var files = e.clipboardData && e.clipboardData.files;
      if (files && files.length && Array.prototype.some.call(files, function (f) { return /^image\//.test(f.type); })) {
        e.preventDefault();
        uploadFiles(files);
      }
    });
    ta.addEventListener("dragover", function (e) {
      if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") !== -1) {
        e.preventDefault();
        box.classList.add("dragging");
      }
    });
    ta.addEventListener("dragleave", function () { box.classList.remove("dragging"); });
    ta.addEventListener("drop", function (e) {
      box.classList.remove("dragging");
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        e.preventDefault();
        ta.focus();
        uploadFiles(e.dataTransfer.files);
      }
    });
    ta.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === "b" || e.key === "B")) { e.preventDefault(); makeBold(); }
    });
    if (o.draftKey) {
      ta.addEventListener("input", function () {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          if (ta.value.trim()) store.set(o.draftKey, ta.value); else store.del(o.draftKey);
        }, 400);
      });
    }

    return {
      ta: ta,
      pending: function () { return pending; },
      clean: function () { return ta.value.replace(/!\[[^\]\n]*\]\(unggah:[^)\n]*\)\n?/g, "").trim(); },
      stopDraft: function () { clearTimeout(saveTimer); }
    };
  }

  /* Kecilkan gambar di browser sebelum diunggah: sisi terpanjang maks 1600 px, JPEG. */
  function prepareImage(file) {
    var maxBytes = limits().gambarBytes || 2097152;
    if (file.size > 25 * 1024 * 1024) {
      return Promise.reject(new ApiError("Gambar terlalu besar. Pilih gambar di bawah 25 MB."));
    }
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new ApiError("File " + file.name + " tidak bisa dibaca sebagai gambar.")); };
      img.src = url;
    }).then(function (img) {
      var w = img.naturalWidth, h = img.naturalHeight;
      var keepOriginal = /^image\/(png|jpeg|webp)$/.test(file.type) && file.size <= 1024 * 1024 &&
        Math.max(w, h) <= CONFIG.IMAGE_MAX_SIDE;
      if (keepOriginal) {
        return toBase64(file).then(function (data) { return { mimeType: file.type, data: data }; });
      }
      var scale = Math.min(1, CONFIG.IMAGE_MAX_SIDE / Math.max(w, h));
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(w * scale));
      canvas.height = Math.max(1, Math.round(h * scale));
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return toJpeg(canvas, 0.86)
        .then(function (blob) { return blob.size > maxBytes ? toJpeg(canvas, 0.65) : blob; })
        .then(function (blob) {
          if (blob.size > maxBytes) throw new ApiError("Gambar masih terlalu besar setelah dikecilkan. Potong dulu bagian yang penting saja.");
          return toBase64(blob).then(function (data) { return { mimeType: "image/jpeg", data: data }; });
        });
    });
  }
  function toJpeg(canvas, q) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (b) { b ? resolve(b) : reject(new ApiError("Gambar gagal diproses.")); }, "image/jpeg", q);
    });
  }
  function toBase64(blob) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(",")[1] || ""); };
      r.onerror = function () { reject(new ApiError("Gambar gagal dibaca.")); };
      r.readAsDataURL(blob);
    });
  }

  /* =======================================================
     BAGIKAN TOPIK
     ======================================================= */
  function topicUrl(id) {
    return location.origin + location.pathname + "#/t/" + encodeURIComponent(id);
  }

  function shareHTML(t) {
    var url = topicUrl(t.id);
    return '<div class="share">' +
      '<button class="btn btn-quiet btn-small share-btn" type="button" id="btnShare" aria-expanded="false" aria-controls="shareMenu">' +
      ICON_SHARE + "Bagikan</button>" +
      '<div class="share-menu" id="shareMenu" hidden>' +
      '<button type="button" data-share="copy">Salin tautan</button>' +
      '<a data-share="wa" target="_blank" rel="noopener" href="' + esc("https://wa.me/?text=" + encodeURIComponent(t.judul + "\n" + url)) + '">Kirim lewat WhatsApp</a>' +
      '<a data-share="tg" target="_blank" rel="noopener" href="' + esc("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(t.judul)) + '">Kirim lewat Telegram</a>' +
      (navigator.share ? '<button type="button" data-share="native">Aplikasi lain…</button>' : "") +
      "</div></div>";
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var t = document.createElement("textarea");
      t.value = text;
      t.setAttribute("readonly", "");
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
      t.remove();
    });
  }

  function setupShare(t) {
    var btn = $("#btnShare"), menu = $("#shareMenu");
    if (!btn || !menu) return;
    var url = topicUrl(t.id);

    function close(focusBtn) {
      menu.hidden = true;
      btn.setAttribute("aria-expanded", "false");
      document.removeEventListener("click", outside, true);
      document.removeEventListener("keydown", onKey);
      if (focusBtn) btn.focus();
    }
    function outside(e) { if (!e.target.closest(".share")) close(false); }
    function onKey(e) { if (e.key === "Escape") close(true); }

    btn.addEventListener("click", function () {
      if (!menu.hidden) { close(false); return; }
      menu.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      menu.firstElementChild.focus();
      setTimeout(function () {
        document.addEventListener("click", outside, true);
        document.addEventListener("keydown", onKey);
      }, 0);
    });

    menu.addEventListener("click", function (e) {
      var item = e.target.closest("[data-share]");
      if (!item) return;
      var kind = item.dataset.share;
      if (kind === "copy") {
        copyText(url).then(function () { toast("Tautan topik disalin"); }, function () { window.prompt("Salin tautan ini:", url); });
      } else if (kind === "native") {
        navigator.share({ title: t.judul, text: t.judul, url: url }).catch(noop);
      }
      close(false);
    });
  }

  /* =======================================================
     PENAMPIL GAMBAR
     ======================================================= */
  var lightbox = document.getElementById("lightbox");

  function openLightbox(id, alt) {
    var big = driveThumb(id, 2000);
    var original = "https://drive.google.com/file/d/" + encodeURIComponent(id) + "/view";
    if (!lightbox || typeof lightbox.showModal !== "function") { window.open(original, "_blank", "noopener"); return; }
    $("#lbImg").src = big;
    $("#lbImg").alt = alt || "";
    $("#lbCap").textContent = alt || "";
    $("#lbCap").hidden = !alt;
    $("#lbOpen").href = original;
    lightbox.showModal();
    $("#lbClose").focus();
  }

  if (lightbox) {
    $("#lbClose").addEventListener("click", function () { lightbox.close(); });
    lightbox.addEventListener("click", function (e) { if (e.target === lightbox) lightbox.close(); });
    lightbox.addEventListener("close", function () { $("#lbImg").removeAttribute("src"); });
  }

  document.addEventListener("click", function (e) {
    var z = e.target.closest(".shot-zoom");
    if (z) openLightbox(z.dataset.zoom, z.dataset.alt);
  });

  /* Gambar yang gagal dimuat (dihapus dari Drive / tidak dibagikan) diganti keterangan. */
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (!img || img.tagName !== "IMG" || !img.closest) return;
    var btn = img.closest(".shot-zoom");
    if (!btn) return;
    var note = document.createElement("span");
    note.className = "shot-missing";
    note.textContent = "Gambar tidak bisa dimuat. Mungkin sudah dihapus dari Google Drive atau tidak dibagikan ke publik.";
    btn.replaceWith(note);
  }, true);

  /* =======================================================
     TAMPILAN: ISI TOPIK
     ======================================================= */
  function loadTopic(id, seq, opts) {
    opts = opts || {};
    if (!/^[A-Z0-9]{4,40}$/i.test(id)) {
      renderNotFound("Alamat topik ini tidak valid.");
      return;
    }

    if (state.prefetched && state.prefetched.topic.id === id) {
      state.topic = state.prefetched;
      state.prefetched = null;
      state.topicLoadedAt = Date.now();
      renderTopic(true);
      return;
    }

    if (!opts.silent) {
      setView("topic-loading");
      app.innerHTML = '<a class="back" href="#/">Semua topik</a>' + skeleton(3);
      window.scrollTo(0, 0);
    }

    api("forum_get_topic", { topicId: id })
      .then(function (res) {
        if (seq !== navSeq) return;
        state.topic = res;
        state.topicLoadedAt = Date.now();
        markSeen(res.topic.id, res.topic.replyCount);
        syncListTopic(res.topic);
        renderTopic(!opts.silent);
      })
      .catch(function (err) {
        if (seq !== navSeq) return;
        if (err.info && err.info.notFound) { renderNotFound(err.message); return; }
        if (opts.silent) {
          var rb = $("#btnRefresh");
          if (rb) setBusy(rb, false);
          if (err.info && err.info.auth) { handleError(err); return; }
          toast(err.message, true);
          return;
        }
        handleError(err, app, function () { loadTopic(id, navSeq); });
      });
  }

  function syncListTopic(t) {
    state.list.topics.forEach(function (row) {
      if (row.id === t.id) {
        ["replyCount", "pinned", "locked", "judul", "kategori", "imageCount"].forEach(function (k) {
          if (t[k] !== undefined) row[k] = t[k];
        });
      }
    });
  }

  function renderNotFound(msg) {
    setView("notfound");
    setTitle("Topik tidak ditemukan");
    app.innerHTML =
      '<a class="back" href="#/">Semua topik</a>' +
      '<div class="state"><h1 class="thread-title">Topik tidak ditemukan</h1>' +
      '<p style="margin-top:.75rem">' + esc(msg || "Topik ini tidak ada atau sudah dihapus.") + "</p></div>";
    focusHeading();
  }

  function replyItem(r, isNew) {
    var tools = "";
    if (r.canEdit) tools += '<button class="link-btn" type="button" data-edit-reply="' + esc(r.id) + '">Edit</button>';
    if (r.canDelete) tools += '<button class="link-btn danger" type="button" data-del-reply="' + esc(r.id) + '">Hapus</button>';
    return '<li class="reply' + (isNew ? " is-new" : "") + '" id="r-' + esc(r.id) + '">' +
      avatar(r.author) +
      "<div>" +
      '<div class="reply-head"><strong>' + esc(r.author.nama) + "</strong><span>" + esc(r.author.roleLabel) + "</span>" +
      timeTag(r.createdAt) + editedTag(r.editedAt) + "</div>" +
      '<div class="reply-body">' + formatBody(r.isi) + "</div>" +
      (tools ? '<div class="reply-tools" style="display:flex;gap:1rem">' + tools + "</div>" : "") +
      "</div></li>";
  }

  function repliesTitle(n) { return n ? n + " balasan" : "Belum ada balasan"; }

  function renderTopic(focus) {
    setView("topic");
    renderWho();

    var d = state.topic;
    var t = d.topic;
    var lim = limits();
    var draftKey = KEY.draftReply + t.id;
    setTitle(t.judul);

    var actions = shareHTML(t);
    if (t.canEdit) actions += '<a class="btn btn-quiet btn-small" href="#/edit/' + encodeURIComponent(t.id) + '">Edit</a>';
    if (d.canModerate) {
      actions +=
        '<button class="btn btn-quiet btn-small" type="button" data-mod="pinned">' + (t.pinned ? "Lepas sematan" : "Sematkan") + "</button>" +
        '<button class="btn btn-quiet btn-small" type="button" data-mod="locked">' + (t.locked ? "Buka kunci" : "Kunci topik") + "</button>";
    }
    if (t.canDelete) actions += '<button class="btn btn-danger btn-small" type="button" id="btnDelTopic">Hapus topik</button>';

    var composer;
    if (d.canReply) {
      composer =
        '<form class="composer" id="formReply" novalidate>' +
        '<label for="replyText">Tulis balasan</label>' +
        editorHTML({ id: "replyText", max: lim.balasan, placeholder: "Tanggapan, pengalaman, atau jawaban Anda" }) +
        '<p class="form-error" role="alert" hidden></p>' +
        '<div class="form-foot"><span class="hint counter" data-for="replyText"></span>' +
        '<button class="btn btn-primary" type="submit">Kirim balasan</button></div>' +
        "</form>";
    } else if (!state.session) {
      composer = '<p class="note"><a href="#/masuk">Masuk</a> untuk ikut membalas diskusi ini.</p>';
    } else {
      composer = '<p class="note">Topik ini sudah dikunci admin. Balasan baru ditutup.</p>';
    }

    app.innerHTML =
      '<article class="thread">' +
      '<a class="back" href="#/">Semua topik</a>' +
      '<header class="thread-head">' +
      '<p class="thread-cat' + (catGold(t.kategori) ? " gold" : "") + '">' + esc(catLabel(t.kategori)) + "</p>" +
      '<h1 class="thread-title" tabindex="-1" dir="auto">' +
      (t.pinned ? STAR + '<span class="sr-only">Disematkan: </span>' : "") + esc(t.judul) +
      (t.locked ? LOCK + '<span class="sr-only"> (dikunci)</span>' : "") + "</h1>" +
      '<div class="byline">' + avatar(t.author) +
      "<div><strong>" + esc(t.author.nama) + '</strong><span class="sub">' + esc(t.author.roleLabel) + ", " +
      timeTag(t.createdAt) + (t.editedAt ? ", " + editedTag(t.editedAt) : "") + "</span></div></div>" +
      "</header>" +
      '<div class="post-body">' + formatBody(t.isi) + "</div>" +
      '<div class="thread-actions">' + actions + "</div>" +
      '<section aria-labelledby="repliesTitle">' +
      '<div class="replies-head"><h2 id="repliesTitle">' + repliesTitle(d.replies.length) + "</h2>" +
      '<button class="link-btn" type="button" id="btnRefresh">Muat balasan terbaru</button></div>' +
      '<ol class="reply-list" id="replyList">' + d.replies.map(function (r) { return replyItem(r); }).join("") + "</ol>" +
      (d.replies.length ? "" : '<p class="no-replies" id="noReplies">Jadilah yang pertama menanggapi.</p>') +
      "</section>" +
      composer +
      "</article>";

    if (focus) { window.scrollTo(0, 0); focusHeading(); }

    setupShare(t);

    $("#btnRefresh").addEventListener("click", function () {
      setBusy(this, true, "Memuat…");
      loadTopic(t.id, navSeq, { silent: true });
    });

    $("#replyList").addEventListener("click", function (e) {
      var del = e.target.closest("[data-del-reply]");
      if (del) { deleteReply(del.dataset.delReply, del); return; }
      var ed = e.target.closest("[data-edit-reply]");
      if (ed) startEditReply(ed.dataset.editReply);
    });

    Array.prototype.forEach.call(document.querySelectorAll("[data-mod]"), function (b) {
      b.addEventListener("click", function () { moderate(b.dataset.mod, b); });
    });

    var delTopic = $("#btnDelTopic");
    if (delTopic) delTopic.addEventListener("click", function () { deleteTopic(delTopic); });

    var form = $("#formReply");
    if (form) {
      var editor = setupEditor(form, { draftKey: draftKey });
      editor.ta.value = store.get(draftKey) || "";
      bindCounter(editor.ta, lim.balasan);
      submitOnCtrlEnter(editor.ta, form);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        submitReply(form, editor, draftKey);
      });
    }
  }

  function submitReply(form, editor, draftKey) {
    if (editor.pending()) { showFormError(form, "Tunggu sampai semua gambar selesai diunggah."); return; }
    var text = editor.clean();
    if (!text) { showFormError(form, "Balasan masih kosong."); editor.ta.focus(); return; }
    showFormError(form, "");

    var btn = $('button[type="submit"]', form);
    setBusy(btn, true, "Mengirim…");
    var topic = state.topic.topic;

    api("forum_create_reply", { topicId: topic.id, isi: text })
      .then(function (res) {
        setBusy(btn, false);
        editor.stopDraft();
        editor.ta.value = "";
        editor.ta.dispatchEvent(new Event("input"));
        store.del(draftKey);

        state.topic.replies.push(res.reply);
        topic.replyCount = res.replyCount || state.topic.replies.length;
        markSeen(topic.id, topic.replyCount);
        syncListTopic(topic);
        state.list.loadedAt = 0;

        var empty = $("#noReplies");
        if (empty) empty.remove();
        $("#replyList").insertAdjacentHTML("beforeend", replyItem(res.reply, true));
        $("#repliesTitle").textContent = repliesTitle(state.topic.replies.length);
        var tabTulis = $('[data-tab="tulis"]', form);
        if (tabTulis) tabTulis.click();
        toast("Balasan terkirim");
      })
      .catch(function (err) {
        setBusy(btn, false);
        if (err.info && err.info.auth) { handleError(err); return; }
        showFormError(form, err.message);
      });
  }

  function startEditReply(id) {
    var r = null;
    state.topic.replies.forEach(function (x) { if (x.id === id) r = x; });
    var li = document.getElementById("r-" + id);
    if (!r || !li || li.querySelector(".reply-edit")) return;

    var body = $(".reply-body", li), tools = $(".reply-tools", li);
    var taId = "edit-" + id;
    var lim = limits();
    var form = document.createElement("form");
    form.className = "reply-edit";
    form.noValidate = true;
    form.innerHTML =
      '<label class="sr-only" for="' + taId + '">Edit balasan</label>' +
      editorHTML({ id: taId, max: lim.balasan, value: r.isi }) +
      '<p class="form-error" role="alert" hidden></p>' +
      '<div class="form-foot"><span class="hint counter" data-for="' + taId + '"></span>' +
      '<div class="btn-row"><button type="button" class="btn btn-quiet btn-small" data-cancel>Batal</button>' +
      '<button type="submit" class="btn btn-primary btn-small">Simpan</button></div></div>';

    body.hidden = true;
    if (tools) tools.hidden = true;
    body.parentNode.insertBefore(form, body.nextSibling);

    var editor = setupEditor(form, {});
    bindCounter(editor.ta, lim.balasan);
    submitOnCtrlEnter(editor.ta, form);
    editor.ta.focus();
    editor.ta.setSelectionRange(editor.ta.value.length, editor.ta.value.length);

    function cancel() {
      form.remove();
      body.hidden = false;
      if (tools) tools.hidden = false;
    }
    $("[data-cancel]", form).addEventListener("click", function () {
      if (editor.ta.value !== r.isi && !confirm("Buang perubahan pada balasan ini?")) return;
      cancel();
    });
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (editor.pending()) { showFormError(form, "Tunggu sampai semua gambar selesai diunggah."); return; }
      var text = editor.clean();
      if (!text) { showFormError(form, "Balasan tidak boleh kosong."); return; }
      if (text === r.isi) { cancel(); return; }
      var btn = $('button[type="submit"]', form);
      setBusy(btn, true, "Menyimpan…");
      api("forum_update_reply", { replyId: id, isi: text })
        .then(function (res) {
          r.isi = res.reply.isi;
          r.editedAt = res.reply.editedAt;
          li.outerHTML = replyItem(r);
          toast("Balasan diperbarui");
        })
        .catch(function (err) {
          setBusy(btn, false);
          if (err.info && err.info.auth) { handleError(err); return; }
          showFormError(form, err.message);
        });
    });
  }

  function deleteReply(id, btn) {
    if (!confirm("Hapus balasan ini? Tindakan ini tidak bisa dibatalkan.")) return;
    setBusy(btn, true, "Menghapus…");
    api("forum_delete", { type: "reply", id: id })
      .then(function (res) {
        state.topic.replies = state.topic.replies.filter(function (r) { return r.id !== id; });
        var t = state.topic.topic;
        t.replyCount = res.replyCount != null ? res.replyCount : state.topic.replies.length;
        markSeen(t.id, t.replyCount);
        syncListTopic(t);
        state.list.loadedAt = 0;
        var li = document.getElementById("r-" + id);
        if (li) li.remove();
        $("#repliesTitle").textContent = repliesTitle(state.topic.replies.length);
        toast("Balasan dihapus");
      })
      .catch(function (err) {
        setBusy(btn, false);
        handleError(err);
      });
  }

  function deleteTopic(btn) {
    var t = state.topic.topic;
    if (!confirm("Hapus topik “" + t.judul + "” beserta semua balasannya dari forum?")) return;
    setBusy(btn, true, "Menghapus…");
    api("forum_delete", { type: "topic", id: t.id })
      .then(function () {
        state.list.topics = state.list.topics.filter(function (row) { return row.id !== t.id; });
        state.list.loadedAt = 0;
        state.topic = null;
        toast("Topik dihapus");
        go("#/");
      })
      .catch(function (err) {
        setBusy(btn, false);
        handleError(err);
      });
  }

  function moderate(field, btn) {
    var t = state.topic.topic;
    var value = !t[field];
    setBusy(btn, true, "Menyimpan…");
    api("forum_moderate", { topicId: t.id, field: field, value: value })
      .then(function () {
        t[field] = value;
        if (field === "locked") {
          t.canEdit = isAdmin() || (t.isMine && !value);
          state.topic.canReply = !value || isAdmin();
        }
        syncListTopic(t);
        state.list.loadedAt = 0;
        renderTopic(false);
        toast(field === "pinned"
          ? (value ? "Topik disematkan di atas daftar" : "Sematan dilepas")
          : (value ? "Topik dikunci" : "Kunci topik dibuka"));
      })
      .catch(function (err) {
        setBusy(btn, false);
        handleError(err);
      });
  }

  /* =======================================================
     TAMPILAN: TULIS / EDIT TOPIK
     ======================================================= */
  function loadEdit(id, seq) {
    if (!/^[A-Z0-9]{4,40}$/i.test(id)) { renderNotFound("Alamat topik ini tidak valid."); return; }
    if (state.topic && state.topic.topic.id === id) {
      if (!state.topic.topic.canEdit) { renderNotFound("Anda tidak punya izin mengedit topik ini."); return; }
      renderTopicForm("edit", state.topic.topic);
      return;
    }
    setView("edit-loading");
    app.innerHTML = skeleton(3);
    api("forum_get_topic", { topicId: id })
      .then(function (res) {
        if (seq !== navSeq) return;
        state.topic = res;
        state.topicLoadedAt = Date.now();
        if (!res.topic.canEdit) { renderNotFound("Anda tidak punya izin mengedit topik ini."); return; }
        renderTopicForm("edit", res.topic);
      })
      .catch(function (err) {
        if (seq !== navSeq) return;
        if (err.info && err.info.notFound) { renderNotFound(err.message); return; }
        handleError(err, app, function () { loadEdit(id, navSeq); });
      });
  }

  function renderTopicForm(mode, topic) {
    var isEdit = mode === "edit";
    setView(isEdit ? "edit" : "new");
    setTitle(isEdit ? "Edit topik" : "Topik baru");
    renderWho();

    var lim = limits();
    var admin = isAdmin();
    var cats = (state.meta.categories || []).filter(function (c) {
      return !c.adminOnly || admin || (isEdit && c.id === topic.kategori);
    });
    var draft = isEdit
      ? { kategori: topic.kategori, judul: topic.judul, isi: topic.isi }
      : (store.get(KEY.draftTopic) || {});
    var preset = draft.kategori ||
      (cats.some(function (c) { return c.id === state.list.kategori; }) ? state.list.kategori : "");
    var backHref = isEdit ? "#/t/" + encodeURIComponent(topic.id) : "#/";

    app.innerHTML =
      '<form class="compose" id="formTopic" novalidate>' +
      '<a class="back" href="' + backHref + '" id="formBack">Batal</a>' +
      '<h1 tabindex="-1">' + (isEdit ? "Edit topik" : "Topik baru") + "</h1>" +
      '<div class="field"><label for="fKat">Kategori</label>' +
      '<select id="fKat" required><option value="">Pilih kategori</option>' +
      cats.map(function (c) {
        return '<option value="' + esc(c.id) + '"' + (c.id === preset ? " selected" : "") + ">" + esc(c.label) + "</option>";
      }).join("") +
      "</select>" +
      '<p class="hint" id="katHint" hidden>Untuk panduan: tekan <b>Langkah</b> untuk menomori tiap langkah, lalu sisipkan tangkapan layar tepat di bawahnya.</p></div>' +
      '<div class="field"><label for="fJudul">Judul</label>' +
      '<input id="fJudul" type="text" maxlength="' + lim.judul + '" autocomplete="off" dir="auto" ' +
      'placeholder="Contoh: Cara mencatat setoran murojaah harian" value="' + esc(draft.judul || "") + '" required></div>' +
      '<div class="field"><label for="fIsi">Isi</label>' +
      editorHTML({ id: "fIsi", max: lim.isi, value: draft.isi || "" }) +
      '<p class="hint">Gambar bisa disisipkan lewat tombol Gambar, ditempel (Ctrl+V), atau diseret ke kotak isi. ' +
      "Tulis keterangan gambar di antara tanda [ ]. Ayat berhuruf Arab tampil dari kanan ke kiri dengan sendirinya.</p></div>" +
      '<p class="form-error" role="alert" hidden></p>' +
      '<div class="form-foot"><span class="hint counter" data-for="fIsi"></span>' +
      '<button class="btn btn-primary" type="submit">' + (isEdit ? "Simpan perubahan" : "Terbitkan topik") + "</button></div>" +
      "</form>";

    window.scrollTo(0, 0);
    focusHeading();

    var form = $("#formTopic");
    var fKat = $("#fKat"), fJudul = $("#fJudul");
    var editor = setupEditor(form, {});
    var fIsi = editor.ta;
    bindCounter(fIsi, lim.isi);
    submitOnCtrlEnter(fIsi, form);

    function syncHint() { $("#katHint").hidden = fKat.value !== "panduan"; }
    fKat.addEventListener("change", syncHint);
    syncHint();

    function snapshot() { return { kategori: fKat.value, judul: fJudul.value, isi: fIsi.value }; }
    var original = JSON.stringify(snapshot());
    var saveTimer = null;
    if (!isEdit) {
      form.addEventListener("input", function () {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { store.set(KEY.draftTopic, snapshot()); }, 400);
      });
    }

    $("#formBack").addEventListener("click", function (e) {
      if (isEdit && JSON.stringify(snapshot()) !== original && !confirm("Buang perubahan yang belum disimpan?")) {
        e.preventDefault();
      }
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var judul = fJudul.value.trim().replace(/\s+/g, " ");

      if (!fKat.value) { showFormError(form, "Pilih kategori topik."); fKat.focus(); return; }
      if (judul.length < lim.judulMin) {
        showFormError(form, "Judul minimal " + lim.judulMin + " karakter."); fJudul.focus(); return;
      }
      if (editor.pending()) { showFormError(form, "Tunggu sampai semua gambar selesai diunggah."); return; }
      var isi = editor.clean();
      if (!isi) { showFormError(form, "Isi topik masih kosong."); fIsi.focus(); return; }
      showFormError(form, "");

      var btn = $('button[type="submit"]', form);
      setBusy(btn, true, isEdit ? "Menyimpan…" : "Menerbitkan…");

      var request = isEdit
        ? api("forum_update_topic", { topicId: topic.id, kategori: fKat.value, judul: judul, isi: isi })
        : api("forum_create_topic", { kategori: fKat.value, judul: judul, isi: isi });

      request
        .then(function (res) {
          clearTimeout(saveTimer);
          state.list.loadedAt = 0;
          if (isEdit) {
            var cur = state.topic;
            Object.assign(cur.topic, res.topic);
            syncListTopic(cur.topic);
            state.prefetched = cur;
            toast("Perubahan disimpan");
            go("#/t/" + encodeURIComponent(topic.id));
          } else {
            store.del(KEY.draftTopic);
            markSeen(res.topic.id, 0);
            state.prefetched = res;
            toast("Topik diterbitkan");
            go("#/t/" + encodeURIComponent(res.topic.id));
          }
        })
        .catch(function (err) {
          setBusy(btn, false);
          if (err.info && err.info.auth) {
            if (!isEdit) store.set(KEY.draftTopic, snapshot());
            handleError(err);
            return;
          }
          showFormError(form, err.message);
        });
    });
  }

  /* ---------- Segarkan saat tab kembali aktif ---------- */
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;

    if (state.view === "list" && Date.now() - state.list.loadedAt > CONFIG.STALE_MS) {
      loadList({ force: true, quiet: true });
    }

    if (state.view === "topic" && state.topic && Date.now() - state.topicLoadedAt > CONFIG.STALE_MS) {
      var busy = Array.prototype.some.call(document.querySelectorAll("#app textarea"), function (ta) {
        return ta.value.trim() || document.activeElement === ta;
      });
      if (!busy) loadTopic(state.topic.topic.id, navSeq, { silent: true });
    }
  });

  window.addEventListener("hashchange", function (e) {
    try { lastHash = new URL(e.oldURL).hash; } catch (x) { lastHash = ""; }
    route();
  });

  applyMeta(state.meta, false);
  renderWho();
  route();
})();
</script>
</body>
</html>
